services:
  - type: web
    name: trace-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir services/api --workers 1 --limit-concurrency 50
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: deterministic
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
